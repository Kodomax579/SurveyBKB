services:
  # DEIN NEUES BLAZOR FRONTEND
  frontend:
    build: 
      context: .
      dockerfile: SchulFunk_Webprojekt/Dockerfile
    ports:
      - "7189:7189"
    environment:
      - ASPNETCORE_URLS=http://+:7189
      - ApiBaseUrl=http://api:7224
    depends_on:
      - api

  # DEIN BESTEHENDES BACKEND (API)
  api:
    build: 
      context: .
      dockerfile: Survey.ApiGateway/Dockerfile
    ports:
      - "7224:7224"
    extra_hosts:
      - "host.docker.internal:host-gateway" # <--- GENAU DIESE ZWEI ZEILEN HIER HINZUFGEN!
    environment:
      - ASPNETCORE_URLS=http://+:7224
      - DefaultConnectionPublish=Host=db;Port=5432;Database=SchulfunkDb;Username=schulfunk_admin;Password=DeinSicheresPasswort;
    depends_on:
      - db
    volumes:
      - ./uploads:/app/wwwroot/uploads

  # DEINE DATENBANK
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=SchulfunkDb
      - POSTGRES_USER=schulfunk_admin
      - POSTGRES_PASSWORD=DeinSicheresPasswort
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: