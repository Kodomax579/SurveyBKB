services:
  # DEIN NEUES BLAZOR FRONTEND
  frontend:
    build: 
      context: . # Baut vom Hauptverzeichnis aus
      dockerfile: SchulFunk_Webprojekt/Dockerfile # Pfad zum neuen Frontend-Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      # Falls dein Frontend die API-URL kennen muss:
      - ApiBaseUrl=http://api:7224 
    depends_on:
      - api

  # DEIN BESTEHENDES BACKEND (API)
  api:
    build: 
      context: .
      dockerfile: Survey.ApiGateway/Dockerfile # Pfad zu dem Dockerfile, das du mir geschickt hast
    ports:
      - "7224:7224"
    environment:
      - ASPNETCORE_URLS=http://+:7224
      - DefaultConnectionPublish=Host=db;Port=5432;Database=SchulfunkDb;Username=schulfunk_admin;Password=DeinSicheresPasswort;
    depends_on:
      - db
    volumes:
      - ./uploads:/app/wwwroot/uploads

  # DEINE DATENBANK
  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=SchulfunkDb
      - POSTGRES_USER=schulfunk_admin
      - POSTGRES_PASSWORD=DeinSicheresPasswort
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: